<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    // Resolve the theme before the stylesheet paints anything. The html tag's
    // data-theme="light" default below is only a no-JS fallback — without this,
    // every reload for a dark-mode reader flashes light first, since app.js's
    // applyTheme() only runs after the deferred module at the bottom of body
    // parses, well after first paint. Mirrors store.js's read("theme", "system")
    // and app.js's applyTheme() resolution exactly, so it can never disagree.
    (function () {
      try {
        var raw = localStorage.getItem("taseer.theme");
        var pref = raw === null ? "system" : JSON.parse(raw);
        var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
  <title>Taseer — hot, cold &amp; histamine</title>
  <meta name="description" content="Does this food run hot or cold across TCM, Ayurveda and Unani — and is it a histamine risk? A remedy finder for how your body feels.">
  <meta name="theme-color" content="#faf5ec">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/ui/taseer-mark-512.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/ui/taseer-mark-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Taseer">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="assets/app.css">
  <!-- app.js is loaded via a dynamic import() (see the module script at the end
       of body), specifically so localhost can cache-bust it — but that means
       the browser's own preload scanner, which only sees <script src> and
       import/export statements it can find while parsing HTML, never notices
       this dependency chain until the inline module script actually runs and
       the import() call executes. Everything past that is then discovered one
       hop at a time as each file's own static imports are parsed — app.js
       finds store.js/views.js/components.js, which finds data.js, which
       finally finds the 1.7MB assets/data/foods.js bundle — paying a full
       network round trip per hop before the next fetch can even start.
       Measured on a cold, throttled load (4x CPU, Fast 3G): the foods.js
       fetch didn't begin until ~4s in, purely from that serial discovery
       chain, before its own ~9s transfer time even started. These hints let
       the browser fetch every file in the chain in parallel from the first
       moment it parses <head>, cutting the discovery delay to ~0. Harmless
       on localhost (worst case, one extra fetch of the un-cache-busted
       app.js URL alongside the real cache-busted one actually used). -->
  <link rel="modulepreload" href="assets/js/app.js">
  <link rel="modulepreload" href="assets/js/store.js">
  <link rel="modulepreload" href="assets/js/views.js">
  <link rel="modulepreload" href="assets/js/components.js">
  <link rel="modulepreload" href="assets/js/data.js">
  <link rel="modulepreload" href="assets/data/foods.js">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="wash" id="wash" aria-hidden="true"></div>

  <div id="banner-slot"></div>

  <main class="main" id="main"></main>

  <!-- No persistent app-name bar: it cost a row on every screen to show the name
       of the app you already opened. The brand is content on home, every other
       screen states what it is in its own h1, and this floating pill is the only
       chrome. Theme lives on Me, where the rest of the settings are. -->
  <nav class="tabbar" aria-label="Main">
    <button class="tabbar__item" data-nav="/"><img class="tabbar__icon" src="assets/ui/icons/tab-feel.png" alt="" aria-hidden="true"><span>Feel</span></button>
    <button class="tabbar__item" data-nav="/find"><img class="tabbar__icon" src="assets/ui/icons/tab-search.png" alt="" aria-hidden="true"><span>Find</span></button>
    <button class="tabbar__item" data-nav="/me"><img class="tabbar__icon" src="assets/ui/icons/tab-me.png" alt="" aria-hidden="true"><span>Me</span></button>
  </nav>

  <script type="module">
    // A module URL is cached independently of the page, so editing app.js and
    // reloading keeps executing the previous build — with a service worker in
    // front of it, for several reloads. Production keeps the plain URL (the SW
    // versions the shell); localhost busts it so a reload means a reload.
    import("./assets/js/app.js" + (location.hostname === "localhost" ? "?t=" + Date.now() : ""));
  </script>
</body>
</html>
