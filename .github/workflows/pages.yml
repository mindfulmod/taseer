name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pillow is only for decoding artwork during validation; the app has no runtime dependencies.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python3 -m pip install Pillow==11.3.0
      - name: Check artwork manifest is current
        run: |
          node scripts/build-artwork-manifest.mjs
          git diff --exit-code assets/data/artwork-manifest.js
      - name: Check UI and caching regressions
        run: node --test tests/*.test.mjs
      - name: Check accessibility patterns
        run: node scripts/check-a11y.mjs
      - name: Validate dataset
        run: node scripts/validate-data.mjs
      - name: Check generated data is current
        run: |
          node scripts/build-data.mjs
          git diff --exit-code assets/data/foods.js \
            || (echo "::error::assets/data/foods.js is stale — run node scripts/build-data.mjs and commit"; exit 1)
      - name: Check the service worker version matches the shell
        run: |
          node scripts/stamp-sw.mjs
          git diff --exit-code sw.js \
            || (echo "::error::sw.js VERSION is stale — run node scripts/stamp-sw.mjs and commit, or installed clients keep the old build"; exit 1)

      - name: Enforce the art palette
        run: node scripts/check-palette.mjs
      - name: Enforce the type scale
        run: node scripts/check-type.mjs
      - name: Validate required heroes and thumbnails
        run: node scripts/check-images.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
